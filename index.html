<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Audit Internal</title>
<style>
:root{--p:#1e3a8a;--bg:#f3f5f9;--t:#1f2937;--b:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 Inter,system-ui,sans-serif;background:var(--bg);color:var(--t)}
button,input,select,textarea{font:inherit}:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.btn{background:var(--p);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
.btn.g{background:#fff;color:var(--p);border:1px solid var(--p)}.btn.r{background:#b91c1c}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 4px #0001;padding:20px}
input,select,textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}
label{display:block;margin:12px 0 4px;font-weight:600}
#login{max-width:380px;margin:12vh auto}#app{display:none}
aside{position:fixed;inset:0 auto 0 0;width:230px;background:var(--p);color:#fff;padding:18px;transition:.2s}
aside nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#dbeafe;padding:11px 12px;border-radius:8px;cursor:pointer;margin:4px 0}
aside nav button.on,aside nav button:hover{background:#ffffff26;color:#fff}
header{margin-left:230px;background:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--b)}
main{margin-left:230px;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.kpi b{display:block;font-size:28px;color:var(--p)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:18px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--b);white-space:nowrap}
.tag{padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.Tinggi{background:#fee2e2;color:#991b1b}.Sedang{background:#ffedd5;color:#9a3412}.Rendah,.Closed{background:#dcfce7;color:#166534}
.Open{background:#fce7f3;color:#9d174d}.InProgress{background:#fef9c3;color:#854d0e}
dialog{border:0;border-radius:12px;max-width:560px;width:92%;padding:22px}
#toast{position:fixed;right:16px;bottom:16px;background:#111827;color:#fff;padding:12px 18px;border-radius:8px;display:none;z-index:9}
#burger{display:none}
@media(max-width:800px){aside{transform:translateX(-100%);z-index:5}aside.open{transform:none}header,main{margin-left:0}#burger{display:inline-block}}
@media print{aside,header,.np{display:none!important}main{margin:0}}
</style></head><body>

<div id="login" class="card"><h2>Audit Internal</h2><p>Masuk dengan username dan password Anda.</p>
<form id="lf"><label for="u">Username</label><input id="u" required autocomplete="username">
<label for="pw">Password</label>
<div style="display:flex;gap:6px"><input id="pw" type="password" required autocomplete="current-password"><button type="button" class="btn g" id="eye">Lihat</button></div>
<p id="le" role="alert" style="color:#b91c1c;min-height:1.5em"></p><button class="btn" style="width:100%">Masuk</button></form></div>

<div id="app"><aside><h3>Audit Internal</h3><nav id="nav"></nav></aside>
<header><button id="burger" class="btn g" aria-label="Menu">Menu</button><span id="who"></span><button class="btn g" id="lo">Keluar</button></header>
<main id="main"></main></div>
<dialog id="dlg"></dialog><div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
// GANTI dua nilai ini (Supabase > Project Settings > API). Hanya anon key, JANGAN service_role.
const SB_URL=https://lworyxjvqanvbxuoqadq.supabase.co/rest/v1/, SB_KEY=sb_publishable_1Lq6-o6ppRK9AQBARkzgTw_EqbIkwH2;
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=d=>d?d.split('-').reverse().join('/'):'-';
const tag=(c,t)=>`<span class="tag ${c.replace(' ','')}">${esc(t||c)}</span>`;
let me,units=[],F=[],charts=[],fails=0,lock=0,idle,cur='dash';
const canEdit=()=>['admin','auditor'].includes(me.role);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)};
const err=m=>{$('#le').textContent=m};

$('#eye').onclick=()=>{const p=$('#pw');p.type=p.type==='password'?'text':'password'};
$('#lf').onsubmit=async e=>{e.preventDefault();
  if(Date.now()<lock)return err('Terlalu banyak percobaan. Coba lagi 1 menit lagi.');
  const {error}=await sb.auth.signInWithPassword({email:$('#u').value.trim().toLowerCase()+'@audit.internal',password:$('#pw').value});
  if(error){if(++fails>=5){lock=Date.now()+60000;fails=0}return err('Username atau password salah.')}
  start()};

async function start(){
  const {data:{session}}=await sb.auth.getSession(); if(!session)return;
  const {data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!p||!p.active){await sb.auth.signOut();return err('Akun nonaktif atau belum terdaftar. Hubungi Admin.')}
  me=p;$('#login').style.display='none';$('#app').style.display='block';
  $('#who').innerHTML=`<b>${esc(p.full_name||p.username)}</b> (${esc(p.role)})`;
  const m=[['dash','Dashboard'],['temuan','Temuan Audit'],...(p.role==='admin'?[['logv','Log Aktivitas']]:[]),['profil','Profil Saya']];
  $('#nav').innerHTML=m.map(x=>`<button data-v="${x[0]}">${x[1]}</button>`).join('');
  await load();nav('dash');idleReset()}

const out=async()=>{await sb.auth.signOut();location.reload()};
$('#lo').onclick=out;
$('#nav').onclick=e=>e.target.dataset.v&&nav(e.target.dataset.v);
$('#burger').onclick=()=>$('aside').classList.toggle('open');
function idleReset(){clearTimeout(idle);idle=setTimeout(out,30*60*1000)}
['click','keydown','mousemove'].forEach(e=>document.addEventListener(e,()=>me&&idleReset()));

async function load(){
  const [a,b]=await Promise.all([sb.from('units').select('*').order('name'),sb.from('findings').select('*,units(name)').order('id',{ascending:false})]);
  units=a.data||[];F=b.data||[];if(b.error)toast(b.error.message)}
function nav(v){cur=v;$('aside').classList.remove('open');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  charts.forEach(c=>c.destroy());charts=[];({dash,temuan,logv,profil})[v]()}

function dash(){
  const today=new Date().toISOString().slice(0,10),lim=new Date(Date.now()+14*864e5).toISOString().slice(0,10);
  const n=s=>F.filter(f=>f.status===s).length;
  const od=F.filter(f=>f.status!=='Closed'&&f.due_date&&f.due_date<today).length;
  const k=[['Total temuan',F.length],['Open',n('Open')],['In Progress',n('In Progress')],['Closed',n('Closed')],['Overdue',od],['Selesai',(F.length?Math.round(n('Closed')*100/F.length):0)+'%']];
  const at=F.filter(f=>f.status!=='Closed'&&f.due_date&&f.due_date<=lim).sort((a,b)=>a.due_date.localeCompare(b.due_date));
  $('#main').innerHTML=`<h2>Ringkasan</h2><div class="grid">${k.map(x=>`<div class="card kpi"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
  <div class="two"><div class="card"><h3>Temuan per risiko</h3><canvas id="c1"></canvas></div><div class="card"><h3>Temuan per unit</h3><canvas id="c2"></canvas></div></div>
  <div class="card tw"><h3>Perlu perhatian (jatuh tempo 14 hari ke depan atau terlambat)</h3>${at.length?`<table><tr><th>No</th><th>Judul</th><th>Unit</th><th>Jatuh tempo</th><th>Keterangan</th></tr>${at.map(f=>`<tr><td>${esc(f.no)}</td><td>${esc(f.title)}</td><td>${esc(f.units?.name)}</td><td>${fd(f.due_date)}</td><td>${f.due_date<today?tag('Tinggi','Terlambat'):tag('Sedang','Segera jatuh tempo')}</td></tr>`).join('')}</table>`:'<p>Tidak ada temuan yang perlu perhatian.</p>'}</div>`;
  const R=['Tinggi','Sedang','Rendah'];
  charts.push(new Chart($('#c1'),{type:'doughnut',data:{labels:R,datasets:[{data:R.map(r=>F.filter(f=>f.risk===r).length),backgroundColor:['#dc2626','#f97316','#16a34a']}]}}));
  charts.push(new Chart($('#c2'),{type:'bar',data:{labels:units.map(u=>u.name),datasets:[{label:'Temuan',data:units.map(u=>F.filter(f=>f.unit_id===u.id).length),backgroundColor:'#1e3a8a'}]},options:{plugins:{legend:{display:false}},scales:{y:{ticks:{precision:0}}}}}))}

function temuan(){
  $('#main').innerHTML=`<h2>Temuan Audit</h2><div class="card"><div class="np" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
  <input id="q" placeholder="Cari judul atau nomor..." aria-label="Cari" style="flex:1;min-width:180px"><select id="sf" aria-label="Filter status" style="width:auto"><option value="">Semua status</option><option>Open</option><option>In Progress</option><option>Closed</option></select>
  ${canEdit()?'<button class="btn" id="add">Tambah temuan</button>':''}<button class="btn g" id="ex">Ekspor CSV</button><button class="btn g" onclick="print()">Cetak</button></div><div class="tw" id="tb"></div></div>`;
  const draw=()=>{const q=$('#q').value.toLowerCase(),s=$('#sf').value;
    const r=F.filter(f=>(!s||f.status===s)&&(f.title+' '+(f.no||'')).toLowerCase().includes(q));
    $('#tb').innerHTML=r.length?`<table><tr><th>No</th><th>Judul</th><th>Unit</th><th>Risiko</th><th>Status</th><th>Jatuh tempo</th><th>Progres</th><th class="np">Aksi</th></tr>${r.map(f=>`<tr><td>${esc(f.no)}</td><td style="white-space:normal;min-width:200px">${esc(f.title)}</td><td>${esc(f.units?.name)}</td><td>${tag(f.risk)}</td><td>${tag(f.status)}</td><td>${fd(f.due_date)}</td><td>${f.progress}%</td><td class="np">${me.role!=='viewer'?`<button class="btn g" onclick="form(${f.id})">${canEdit()?'Ubah':'Tindak lanjut'}</button>`:''}${me.role==='admin'?` <button class="btn r" onclick="del(${f.id})">Hapus</button>`:''}</td></tr>`).join('')}</table>`:'<p>Belum ada temuan yang cocok.</p>'};
  $('#q').oninput=draw;$('#sf').onchange=draw;$('#ex').onclick=csv;if(canEdit())$('#add').onclick=()=>form();draw()}

// [kolom, label, tipe, 1 = boleh diisi Auditee]
const FL=[['title','Judul','text'],['description','Uraian','ta'],['criteria','Kriteria','ta'],['cause','Penyebab','ta'],['impact','Dampak','ta'],['risk','Tingkat risiko','sel:Tinggi,Sedang,Rendah'],['unit_id','Unit','unit'],['recommendation','Rekomendasi','ta'],['due_date','Batas waktu','date'],['action_plan','Rencana tindak lanjut','ta',1],['progress','Progres (%)','number',1],['status','Status','sel:Open,In Progress,Closed',1]];
function form(id){
  const f=F.find(x=>x.id===id)||{};
  const fld=([k,l,t,fu])=>{const dis=!canEdit()&&!fu?'disabled':'';const v=f[k]??(k==='status'?'Open':k==='progress'?0:'');let i;
    if(t==='ta')i=`<textarea id="f_${k}" rows="2" ${dis}>${esc(v)}</textarea>`;
    else if(t==='unit')i=`<select id="f_${k}" required ${dis}>${units.map(u=>`<option value="${u.id}" ${u.id==v?'selected':''}>${esc(u.name)}</option>`).join('')}</select>`;
    else if(t.startsWith('sel')){let o=t.slice(4).split(',');if(k==='status'&&!canEdit())o=o.slice(0,2);i=`<select id="f_${k}" ${dis}>${o.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`}
    else i=`<input id="f_${k}" type="${t}" value="${esc(v)}" ${dis} ${k==='title'?'required':''} ${t==='number'?'min="0" max="100"':''}>`;
    return `<label for="f_${k}">${l}</label>${i}`};
  $('#dlg').innerHTML=`<form id="ff"><h3>${id?(canEdit()?'Ubah temuan':'Isi tindak lanjut'):'Tambah temuan'}</h3>${FL.map(fld).join('')}<p><button type="button" class="btn g" onclick="$('#dlg').close()">Batal</button> <button class="btn">Simpan</button></p></form>`;
  $('#ff').onsubmit=e=>{e.preventDefault();save(id)};$('#dlg').showModal()}
async function save(id){
  const o={};FL.forEach(([k,,t])=>{const e=$('#f_'+k);if(e&&!e.disabled)o[k]=t==='number'?+e.value||0:(e.value||null)});
  if(o.unit_id)o.unit_id=+o.unit_id;
  const r=id?await sb.from('findings').update(o).eq('id',id):await sb.from('findings').insert(o);
  if(r.error)return toast('Gagal menyimpan: '+r.error.message);
  $('#dlg').close();toast('Temuan tersimpan');await load();nav(cur)}
async function del(id){if(!confirm('Hapus temuan ini? Tindakan ini tidak bisa dibatalkan.'))return;
  const {error}=await sb.from('findings').delete().eq('id',id);toast(error?error.message:'Temuan dihapus');await load();nav(cur)}
function csv(){
  const h=['no','title','unit','risk','status','due_date','progress'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[h.join(',')].concat(F.map(f=>h.map(k=>q(k==='unit'?f.units?.name:f[k])).join(',')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'}));a.download='temuan-audit.csv';a.click()}

async function logv(){
  $('#main').innerHTML='<h2>Log Aktivitas</h2><div class="card tw" id="lg">Memuat...</div>';
  const [a,b]=await Promise.all([sb.from('activity_log').select('*').order('at',{ascending:false}).limit(100),sb.from('profiles').select('id,username')]);
  const m=Object.fromEntries((b.data||[]).map(p=>[p.id,p.username]));
  $('#lg').innerHTML=(a.data||[]).length?`<table><tr><th>Waktu</th><th>User</th><th>Aksi</th><th>Data</th></tr>${a.data.map(l=>`<tr><td>${new Date(l.at).toLocaleString('id-ID')}</td><td>${esc(m[l.user_id]||'-')}</td><td>${esc(l.action)}</td><td>${esc(l.table_name)} #${esc(l.row_id)}</td></tr>`).join('')}</table>`:'<p>Belum ada aktivitas.</p>'}

function profil(){
  $('#main').innerHTML=`<h2>Profil Saya</h2><div class="card" style="max-width:420px"><p>Username: <b>${esc(me.username)}</b><br>Role: <b>${esc(me.role)}</b></p>
  <form id="pf"><label for="np">Password baru (minimal 8 karakter)</label><input id="np" type="password" minlength="8" required autocomplete="new-password"><p><button class="btn">Ganti password</button></p></form></div>`;
  $('#pf').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.updateUser({password:$('#np').value});toast(error?error.message:'Password berhasil diganti');e.target.reset()}}

start();
</script></body></html>
